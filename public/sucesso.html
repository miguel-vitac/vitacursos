<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento aprovado</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:700px;margin:12vh auto;padding:30px;text-align:center"><div style="font-size:55px">✓</div><h1 style="font-size:42px">Pagamento aprovado!</h1><p id="msg">Estamos confirmando seu pagamento e preparando seu download...</p><div id="dl"></div><a class="btn primary" href="/" style="display:inline-block;margin-top:25px">Voltar para a loja</a></main><script>(async()=>{const p=new URLSearchParams(location.search);let r=await fetch('/api/verify?payment_id='+encodeURIComponent(p.get('payment_id')||''));let d=await r.json();if(d.approved){let type='download';document.querySelector('#msg').textContent='Seu pagamento foi confirmado. Seu download está liberado:';document.querySelector('#dl').innerHTML='<a class="btn primary" href="/download/'+type+'?order='+encodeURIComponent(d.orderId||'')+'&payment='+encodeURIComponent(p.get('payment_id'))+'&sig='+encodeURIComponent(d.downloadToken)+'">⬇ Baixar agora</a>'}else document.querySelector('#msg').textContent='O pagamento ainda está pendente. Atualize esta página em alguns instantes.'})()</script></body></html>
